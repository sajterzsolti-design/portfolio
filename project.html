<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Project | Zsolti Sajter</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Average&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

</head>


<body>


<!-- =========================
     BACK
========================= -->

<nav class="case-nav">

    <a href="index.html">
        ← Back to Portfolio
    </a>

</nav>



<!-- =========================
     PROJECT CONTENT
========================= -->

<main id="project-container">

    <p>Loading project...</p>

</main>



<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://emuudatwzvzwfvxyoeed.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Y7AJ0hXo7N5Ycrp5UevuIA_DFL2NcC8";


/* =========================
   HELPERS
========================= */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function formatText(value) {

    if (!value) {
        return "";
    }

    return String(value)
        .split(/\n\s*\n/)
        .map(paragraph => {

            return `
                <p>
                    ${escapeHtml(paragraph.trim())}
                </p>
            `;

        })
        .join("");

}



/* =========================
   LOAD PROJECT
========================= */

async function loadProject() {


    const container =
        document.getElementById(
            "project-container"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const projectId =
        params.get("id");


    if (!projectId) {

        container.innerHTML = `
            <p>Project not found.</p>
        `;

        return;
    }


    try {


        /* =========================
           GET PROJECT
        ========================= */

        const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/projects?id=eq.${encodeURIComponent(projectId)}&select=*`,
                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`

                    }

                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            console.error(
                "Supabase error:",
                error
            );

            container.innerHTML = `
                <p>Failed to load project.</p>
            `;

            return;
        }


        const projects =
            await response.json();


        if (!projects.length) {

            container.innerHTML = `
                <p>Project not found.</p>
            `;

            return;
        }


        const project =
            projects[0];


        /* =========================
           PAGE TITLE
        ========================= */

        document.title =
            `${project.title || "Project"} | Zsolti Sajter`;


        /* =========================
           DATA
        ========================= */

        const title =
            project.title || "";


        const category =
            project.category || "SELECTED WORK";


        const subtitle =
            project.case_subtitle ||
            project.description ||
            "";


        const type =
            project.case_type || "";


        const focus =
            project.case_focus || "";


        const tools =
            project.case_tools || "";


        const projectInfo =
            project.case_project || "";


        const about =
            project.case_about || "";


        const direction =
            project.case_direction || "";


        const takeaway =
            project.case_takeaway || "";


        const heroImage =
            project.image_url || "";


        const caseImage =
            project.case_image_url || "";



        /* =========================
           HERO IMAGE
        ========================= */

        const heroImageHtml =
            heroImage
                ? `
                    <img
                        src="${escapeHtml(heroImage)}"
                        alt="${escapeHtml(title)}"
                    >
                `
                : "";



        /* =========================
           SUMMARY
        ========================= */

        let summaryHtml = "";


        if (type) {

            summaryHtml += `

                <div>

                    <span>
                        Type
                    </span>

                    <h3>
                        ${escapeHtml(type)}
                    </h3>

                </div>

            `;

        }


        if (focus) {

            summaryHtml += `

                <div>

                    <span>
                        Focus
                    </span>

                    <h3>
                        ${escapeHtml(focus)}
                    </h3>

                </div>

            `;

        }


        if (tools) {

            summaryHtml += `

                <div>

                    <span>
                        Tools
                    </span>

                    <h3>
                        ${escapeHtml(tools)}
                    </h3>

                </div>

            `;

        }


        if (projectInfo) {

            summaryHtml += `

                <div>

                    <span>
                        Project
                    </span>

                    <h3>
                        ${escapeHtml(projectInfo)}
                    </h3>

                </div>

            `;

        }



        /* =========================
           ABOUT
        ========================= */

        const aboutHtml =
            about
                ? `

                    <div class="section-divider"></div>

                    <section class="case-section">

                        <h2>
                            About the project
                        </h2>

                        <div class="case-content">

                            ${formatText(about)}

                        </div>

                    </section>

                `
                : "";



        /* =========================
           DESIGN DIRECTION
        ========================= */

        const directionHtml =
            direction
                ? `

                    <div class="section-divider"></div>

                    <section class="case-section">

                        <h2>
                            Design direction
                        </h2>

                        <div class="case-content">

                            ${formatText(direction)}

                        </div>

                    </section>

                `
                : "";



        /* =========================
           CASE STUDY IMAGE
        ========================= */

        const caseImageHtml =
            caseImage
                ? `

                    <section class="practice-full-image">

                        <img
                            src="${escapeHtml(caseImage)}"
                            alt="${escapeHtml(title)}"
                        >

                    </section>

                `
                : "";



        /* =========================
           TAKEAWAY
        ========================= */

        const takeawayHtml =
            takeaway
                ? `

                    <div class="section-divider"></div>

                    <section class="case-section">

                        <h2>
                            Takeaway
                        </h2>

                        <div class="case-content">

                            ${formatText(takeaway)}

                        </div>

                    </section>

                `
                : "";



        /* =========================
           PROJECT LINK
        ========================= */

        const projectLinkHtml =
            project.project_url
                ? `

                    <div class="section-divider"></div>

                    <section class="case-section">

                        <div class="case-content">

                            <a
                                href="${escapeHtml(project.project_url)}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                View project →

                            </a>

                        </div>

                    </section>

                `
                : "";



        /* =========================
           RENDER
        ========================= */

        container.innerHTML = `


            <!-- HERO -->

            <section class="case-hero">


                <div class="hero-left">


                    <p class="case-label">

                        ${escapeHtml(category)}

                    </p>


                    <h1>

                        ${escapeHtml(title)}

                    </h1>


                    <p class="case-subtitle">

                        ${escapeHtml(subtitle)}

                    </p>


                </div>


                <div class="hero-mockup">

                    ${heroImageHtml}

                </div>


            </section>



            <!-- SUMMARY -->

            ${
                summaryHtml
                    ? `

                        <section class="project-summary">

                            ${summaryHtml}

                        </section>

                    `
                    : ""
            }



            ${aboutHtml}



            ${directionHtml}



            ${caseImageHtml}



            ${takeawayHtml}



            ${projectLinkHtml}



        `;


    }

    catch (error) {

        console.error(
            "Project loading error:",
            error
        );


        container.innerHTML = `

            <p>
                Something went wrong while loading the project.
            </p>

        `;

    }

}


loadProject();


</script>


</body>

</html>
