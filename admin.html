<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin — Portfolio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 80px auto;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 35px;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
        }

        .project-item {
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        #logout-button {
            margin-top: 35px;
        }

        @media (max-width: 600px) {

            body {
                margin: 40px auto;
                padding: 20px;
                width: 100%;
            }

            h1 {
                font-size: 28px;
            }

            input {
                font-size: 16px;
            }

            button {
                width: 100%;
                padding: 14px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- LOGIN -->

    <div id="login-section">

        <h1>Portfolio Admin</h1>

        <form id="login-form">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Log in
            </button>

        </form>

        <p id="message"></p>

    </div>


    <!-- DASHBOARD -->

    <div id="dashboard" style="display: none;">

        <h1>Admin Dashboard</h1>

        <section>

            <h2>Projects</h2>

            <div id="projects-list"></div>

        </section>


        <section>

            <h2>Practice Projects</h2>

            <div id="practice-projects-list"></div>

        </section>


        <button id="logout-button">
            Log out
        </button>

    </div>


    <script>

        const SUPABASE_URL =
            "https://emuudatwzvzwfvxyoeed.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_Y7AJ0hXo7N5Ycrp5UevuIA_DFL2NcC8";


        let accessToken = null;


        /*
         * LOGIN
         */

        document
            .getElementById("login-form")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");


                const response = await fetch(
                    `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
                    {
                        method: "POST",

                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                if (!response.ok) {

                    const errorData =
                        await response.json();

                    console.error(
                        "Supabase login error:",
                        errorData
                    );

                    message.textContent =
                        errorData.error_description ||
                        errorData.msg ||
                        errorData.message ||
                        "Login failed.";

                    return;
                }


                const data =
                    await response.json();


                console.log(
                    "Logged in:",
                    data
                );


                accessToken =
                    data.access_token;


                /*
                 * SHOW DASHBOARD
                 */

                document
                    .getElementById("login-section")
                    .style.display = "none";

                document
                    .getElementById("dashboard")
                    .style.display = "block";


                /*
                 * LOAD PROJECTS
                 */

                loadAdminProjects();

                loadAdminPracticeProjects();

            });


        /*
         * LOAD PROJECTS
         */

        async function loadAdminProjects() {

            const response = await fetch(
                `${SUPABASE_URL}/rest/v1/projects?select=*&order=sort_order.asc`,
                {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );


            if (!response.ok) {

                console.error(
                    "Failed to load projects:",
                    response.status
                );

                return;
            }


            const projects =
                await response.json();


            const container =
                document.getElementById(
                    "projects-list"
                );


            container.innerHTML = "";


            projects.forEach(project => {

                const item =
                    document.createElement("div");


                item.className =
                    "project-item";


                item.textContent =
                    project.title;


                container.appendChild(item);

            });

        }


        /*
         * LOAD PRACTICE PROJECTS
         */

        async function loadAdminPracticeProjects() {

            const response = await fetch(
                `${SUPABASE_URL}/rest/v1/practice_projects?select=*&order=sort_order.asc`,
                {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );


            if (!response.ok) {

                console.error(
                    "Failed to load practice projects:",
                    response.status
                );

                return;
            }


            const projects =
                await response.json();


            const container =
                document.getElementById(
                    "practice-projects-list"
                );


            container.innerHTML = "";


            projects.forEach(project => {

                const item =
                    document.createElement("div");


                item.className =
                    "project-item";


                item.textContent =
                    project.title;


                container.appendChild(item);

            });

        }


        /*
         * LOG OUT
         */

        document
            .getElementById("logout-button")
            .addEventListener("click", function() {

                accessToken = null;

                document
                    .getElementById("dashboard")
                    .style.display = "none";

                document
                    .getElementById("login-section")
                    .style.display = "block";

                document
                    .getElementById("login-form")
                    .reset();

            });

    </script>

</body>
</html>
