<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Project | Zsolti Sajter</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Average&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

</head>


<body>


<!-- =========================
     NAVIGATION
========================= -->

<nav class="case-nav">

    <a href="index.html">
        ← Back to Portfolio
    </a>

</nav>



<!-- =========================
     PROJECT
========================= -->

<main id="project-container">

    <p>Loading project...</p>

</main>



<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://emuudatwzvzwfvxyoeed.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Y7AJ0hXo7N5Ycrp5UevuIA_DFL2NcC8";



/* =========================
   LOAD PROJECT
========================= */

async function loadProject() {

    const container =
        document.getElementById("project-container");


    const params =
        new URLSearchParams(
            window.location.search
        );


    const projectId =
        params.get("id");


    if (!projectId) {

        container.innerHTML = `
            <p>Project not found.</p>
        `;

        return;
    }



    try {


        /* =========================
           GET PROJECT
        ========================= */

        const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/projects?id=eq.${encodeURIComponent(projectId)}&select=*`,
                {
                    method: "GET",

                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            console.error(
                "Supabase error:",
                error
            );

            container.innerHTML = `
                <p>Failed to load project.</p>
            `;

            return;
        }


        const projects =
            await response.json();


        if (!projects.length) {

            container.innerHTML = `
                <p>Project not found.</p>
            `;

            return;
        }


        const project =
            projects[0];



        /* =========================
           PAGE TITLE
        ========================= */

        document.title =
            `${project.title || "Project"} | Zsolti Sajter`;



        /* =========================
           IMAGE
        ========================= */

        const heroImage =
            project.image_url
                ? `
                    <img
                        src="${escapeHtml(project.image_url)}"
                        alt="${escapeHtml(project.title || "Project")}"
                    >
                `
                : "";



        /* =========================
           HERO
        ========================= */

        container.innerHTML = `

            <section class="case-hero">

                <div class="hero-left">

                    <p class="case-label">
                        ${escapeHtml(
                            project.category ||
                            "PROJECT"
                        )}
                    </p>


                    <h1>
                        ${escapeHtml(
                            project.title || ""
                        )}
                    </h1>


                    <p class="case-subtitle">
                        ${escapeHtml(
                            project.case_subtitle ||
                            project.description ||
                            ""
                        )}
                    </p>

                </div>


                <div class="hero-mockup">

                    ${heroImage}

                </div>

            </section>



            <!-- =========================
                 PROJECT SUMMARY
            ========================= -->

            <section class="project-summary">


                <div>

                    <span>
                        Type
                    </span>

                    <h3>
                        ${escapeHtml(
                            project.case_type || "—"
                        )}
                    </h3>

                </div>



                <div>

                    <span>
                        Focus
                    </span>

                    <h3>
                        ${escapeHtml(
                            project.case_focus || "—"
                        )}
                    </h3>

                </div>



                <div>

                    <span>
                        Tools
                    </span>

                    <h3>
                        ${escapeHtml(
                            project.case_tools || "—"
                        )}
                    </h3>

                </div>



                <div>

                    <span>
                        Project
                    </span>

                    <h3>
                        ${escapeHtml(
                            project.case_project ||
                            "—"
                        )}
                    </h3>

                </div>


            </section>



            <div class="section-divider"></div>



            <!-- =========================
                 ABOUT
            ========================= -->

            <section class="case-section">


                <h2>
                    About the project
                </h2>


                <div class="case-content">

                    <p>
                        ${escapeHtml(
                            project.case_about ||
                            project.description ||
                            ""
                        )}
                    </p>

                </div>


            </section>



            <!-- =========================
                 DESIGN DIRECTION
            ========================= -->

            ${
                project.case_direction
                ? `

                    <section class="case-section">

                        <h2>
                            Design direction
                        </h2>

                        <div class="case-content">

                            <p>
                                ${escapeHtml(
                                    project.case_direction
                                )}
                            </p>

                        </div>

                    </section>

                `
                : ""
            }



            <!-- =========================
                 TAKEAWAY
            ========================= -->

            ${
                project.case_takeaway
                ? `

                    <section class="case-section">

                        <h2>
                            Takeaway
                        </h2>

                        <div class="case-content">

                            <p>
                                ${escapeHtml(
                                    project.case_takeaway
                                )}
                            </p>

                        </div>

                    </section>

                `
                : ""
            }



            <!-- =========================
                 PROJECT LINK
            ========================= -->

            ${
                project.project_url
                ? `

                    <section class="case-section">

                        <a
                            class="cta-btn"
                            href="${escapeHtml(
                                project.project_url
                            )}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            View project →
                        </a>

                    </section>

                `
                : ""
            }


        `;


    }

    catch (error) {

        console.error(
            "Failed to load project:",
            error
        );


        container.innerHTML = `
            <p>
                Failed to load project.
            </p>
        `;

    }

}



/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================
   START
========================= */

loadProject();


</script>


</body>

</html>
