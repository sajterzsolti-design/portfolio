<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project | Case Study</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Average&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

</head>

<body>


<!-- BACK -->

<nav class="case-nav">

    <a href="index.html">
        ← Back to Portfolio
    </a>

</nav>


<main id="project-container">

    <p>Loading project...</p>

</main>


<script>

const SUPABASE_URL =
    "https://emuudatwzvzwfvxyoeed.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Y7AJ0hXo7N5Ycrp5UevuIA_DFL2NcC8";


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function formatParagraphs(value) {

    if (!value) {
        return "";
    }

    return String(value)
        .split(/\n\s*\n/)
        .map(paragraph => `
            <p>
                ${escapeHtml(paragraph.trim())}
            </p>
        `)
        .join("");

}


async function loadProject() {

    const container =
        document.getElementById("project-container");

    const params =
        new URLSearchParams(window.location.search);

    const projectId =
        params.get("id");

    const projectType =
        params.get("type") || "project";

    const tableName =
        projectType === "practice"
            ? "practice_projects"
            : "projects";


    if (!projectId) {

        container.innerHTML =
            "<p>Project not found.</p>";

        return;
    }


    try {

        const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/${tableName}?id=eq.${encodeURIComponent(projectId)}&select=*`,
                {
                    method: "GET",
                    headers: {
                        "apikey": SUPABASE_KEY
                    }
                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            console.error(
                "Supabase error:",
                error
            );

            container.innerHTML =
                "<p>Failed to load project.</p>";

            return;
        }


        const projects =
            await response.json();


        if (!projects.length) {

            container.innerHTML =
                "<p>Project not found.</p>";

            return;
        }


        const project =
            projects[0];


        document.title =
            `${project.title || "Project"} | Case Study`;


        /* HERO */

        const heroImage =
            project.hero_image_url || project.image_url
                ? `
                    <div class="hero-mockup">

                        <img
                            src="${escapeHtml(project.hero_image_url || project.image_url)}"
                            alt="${escapeHtml(project.title || "Project")}"
                        >

                    </div>
                `
                : "";


        /* SUMMARY */

        const summaryItems = [];

        if (project.case_type) {

            summaryItems.push(`
                <div>
                    <span>Role</span>
                    <h3>${escapeHtml(project.case_type)}</h3>
                </div>
            `);

        }

        if (project.case_focus) {

            summaryItems.push(`
                <div>
                    <span>Focus</span>
                    <h3>${escapeHtml(project.case_focus)}</h3>
                </div>
            `);

        }

        if (project.case_tools) {

            summaryItems.push(`
                <div>
                    <span>Tools</span>
                    <h3>${escapeHtml(project.case_tools)}</h3>
                </div>
            `);

        }

        if (project.case_project) {

            summaryItems.push(`
                <div>
                    <span>Project</span>
                    <h3>${escapeHtml(project.case_project)}</h3>
                </div>
            `);

        }


        /* ABOUT / OVERVIEW */

        const aboutSection =
            project.case_about
                ? `

                    <div class="section-divider"></div>

                    <section class="case-section">

                        <h2>
                            Overview
                        </h2>

                        <div class="case-content">

                            ${formatParagraphs(project.case_about)}

                        </div>

                    </section>

                `
                : "";


        /* DESIGN DIRECTION */

        const directionSection =
            project.case_direction
                ? `

                    <div class="section-divider"></div>

                    <section class="case-section">

                        <h2>
                            Design Direction
                        </h2>

                        <div class="case-content">

                            ${formatParagraphs(project.case_direction)}

                        </div>

                    </section>

                `
                : "";


        /* CASE STUDY IMAGE */

        const caseImageSection =
            project.case_image_url
                ? `

                    <section class="final-image">

                        <img
                            src="${escapeHtml(project.case_image_url)}"
                            alt="${escapeHtml(project.title || "Project")}"
                        >

                    </section>

                `
                : "";


        /* TAKEAWAYS */

        const takeawaySection =
            project.case_takeaway
                ? `

                    <div class="section-divider"></div>

                    <section class="case-section">

                        <h2>
                            Takeaways
                        </h2>

                        <div class="case-content">

                            ${formatParagraphs(project.case_takeaway)}

                        </div>

                    </section>

                `
                : "";



        /* RENDER */

        container.innerHTML = `

            <!-- HERO -->

            <section class="case-hero">

                <div class="hero-left">

                    <p class="case-label">
                        ${escapeHtml(
                            project.category ||
                            "UX/UI CASE STUDY"
                        )}
                    </p>

                    <h1>
                        ${escapeHtml(project.title || "")}
                    </h1>

                    ${
                        project.case_subtitle
                            ? `
                                <p class="case-subtitle">
                                    ${escapeHtml(project.case_subtitle)}
                                </p>
                            `
                            : ""
                    }

                </div>

                ${heroImage}

            </section>


            <!-- PROJECT SUMMARY -->

            ${
                summaryItems.length
                    ? `
                        <section class="project-summary">

                            ${summaryItems.join("")}

                        </section>
                    `
                    : ""
            }


            ${aboutSection}


            ${directionSection}


            ${caseImageSection}


            ${takeawaySection}


        `;

    }

    catch (error) {

        console.error(
            "Project loading error:",
            error
        );

        container.innerHTML =
            "<p>Failed to load project.</p>";

    }

}


loadProject();

</script>


</body>

</html>
