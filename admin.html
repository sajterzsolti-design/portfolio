<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 60px auto;
            padding: 20px;
            background: #f7f7f7;
        }

        h1 {
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 40px;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: white;
            border-radius: 5px;
        }

        button:hover {
            background: #eee;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .primary-button {
            background: #111;
            color: white;
            border-color: #111;
        }

        .primary-button:hover {
            background: #333;
        }

        .danger-button {
            background: #b00020;
            color: white;
            border-color: #b00020;
        }

        .danger-button:hover {
            background: #8d001a;
        }

        #login-section {
            max-width: 500px;
            margin: 100px auto;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: inherit;
            font-size: 16px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        .section-header h2 {
            margin: 0;
        }

        .project-item {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .project-info {
            margin-bottom: 15px;
        }

        .project-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .project-meta {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .project-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .sort-buttons {
            display: flex;
            gap: 5px;
        }

        #logout-button {
            margin-top: 40px;
        }

        #message {
            margin-top: 20px;
        }

        #editor-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            padding: 30px;
            overflow-y: auto;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 10px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-button {
            font-size: 22px;
            border: none;
            background: none;
        }

        .form-label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .checkbox-row input {
            width: auto;
            margin: 0;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        #current-image,
        #current-case-image {
            max-width: 200px;
            max-height: 150px;
            display: none;
            object-fit: cover;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .error-message {
            color: #b00020;
            margin-top: 15px;
            white-space: pre-wrap;
        }

        .success-message {
            color: #167a35;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            body {
                margin: 20px auto;
                padding: 15px;
            }

            #login-section {
                margin: 50px auto;
            }

            h1 {
                font-size: 28px;
            }

            .section-header {
                align-items: stretch;
                flex-direction: column;
            }

            .section-header button {
                width: 100%;
            }

            .project-actions button {
                flex: 1 1 calc(50% - 8px);
            }

            #editor-modal {
                padding: 10px;
            }

            .modal-content {
                margin: 10px auto;
                padding: 20px;
            }

            .modal-actions {
                flex-direction: column;
            }

            .modal-actions button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div id="login-section">
        <h1>Portfolio Admin</h1>

        <form id="login-form">
            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit" class="primary-button">
                Log in
            </button>
        </form>

        <p id="message"></p>
    </div>


    <!-- DASHBOARD -->
    <div id="dashboard" style="display: none;">

        <h1>Admin Dashboard</h1>

        <section>
            <div class="section-header">
                <h2>Projects</h2>

                <button
                    class="primary-button"
                    type="button"
                    onclick="openAddModal('projects')"
                >
                    + Add Project
                </button>
            </div>

            <div id="projects-list"></div>
        </section>


        <section>
            <div class="section-header">
                <h2>Practice Projects</h2>

                <button
                    class="primary-button"
                    type="button"
                    onclick="openAddModal('practice_projects')"
                >
                    + Add Practice Project
                </button>
            </div>

            <div id="practice-projects-list"></div>
        </section>

        <button id="logout-button" type="button">
            Log out
        </button>
    </div>


    <!-- EDITOR MODAL -->
    <div id="editor-modal">

        <div class="modal-content">

            <div class="modal-header">
                <h2 id="modal-title">Add Project</h2>

                <button
                    class="close-button"
                    type="button"
                    onclick="closeModal()"
                    aria-label="Close"
                >
                    ×
                </button>
            </div>


            <form id="project-form">

                <label class="form-label" for="project-title">
                    Title
                </label>

                <input
                    type="text"
                    id="project-title"
                    required
                >


                <label class="form-label" for="project-slug">
                    Slug
                </label>

                <input
                    type="text"
                    id="project-slug"
                    required
                >


                <label class="form-label" for="project-category">
                    Category
                </label>

                <input
                    type="text"
                    id="project-category"
                >


                <label class="form-label" for="project-description">
                    Description
                </label>

                <textarea id="project-description"></textarea>


                <label class="form-label" for="project-case-subtitle">
                    Case Study Subtitle
                </label>

                <textarea
                    id="project-case-subtitle"
                    placeholder="Short introduction displayed in the hero section"
                ></textarea>


                <label class="form-label" for="project-case-type">
                    Type
                </label>

                <input
                    type="text"
                    id="project-case-type"
                    placeholder="e.g. Brand Identity"
                >


                <label class="form-label" for="project-case-focus">
                    Focus
                </label>

                <input
                    type="text"
                    id="project-case-focus"
                    placeholder="e.g. Packaging"
                >


                <label class="form-label" for="project-case-tools">
                    Tools
                </label>

                <input
                    type="text"
                    id="project-case-tools"
                    placeholder="e.g. Figma"
                >


                <label class="form-label" for="project-case-project">
                    Project
                </label>

                <input
                    type="text"
                    id="project-case-project"
                    placeholder="e.g. Self-initiated"
                >


                <label class="form-label" for="project-case-about">
                    About the Project
                </label>

                <textarea
                    id="project-case-about"
                    placeholder="Describe the project..."
                ></textarea>


                <label class="form-label" for="project-case-direction">
                    Design Direction
                </label>

                <textarea
                    id="project-case-direction"
                    placeholder="Describe the design direction..."
                ></textarea>


                <label class="form-label" for="project-case-takeaway">
                    Takeaway
                </label>

                <textarea
                    id="project-case-takeaway"
                    placeholder="What did you learn from this project?"
                ></textarea>


                <label class="form-label" for="project-url">
                    Project URL
                </label>

                <input
                    type="text"
                    id="project-url"
                    placeholder="https://..."
                >


                <label class="form-label">
                    Current Image
                </label>

                <img
                    id="current-image"
                    alt="Current project image"
                >


                <label class="form-label" for="project-image">
                    Main Image
                </label>

                <input
                    type="file"
                    id="project-image"
                    accept="image/*"
                >


                <label class="form-label">
                    Current Case Study Image
                </label>

                <img
                    id="current-case-image"
                    alt="Current case study image"
                >


                <label class="form-label" for="project-case-image">
                    Case Study Image
                </label>

                <input
                    type="file"
                    id="project-case-image"
                    accept="image/*"
                >


                <div class="checkbox-row">
                    <input
                        type="checkbox"
                        id="project-featured"
                    >

                    <label for="project-featured">
                        Featured
                    </label>
                </div>


                <label class="form-label" for="project-sort-order">
                    Sort Order
                </label>

                <input
                    type="number"
                    id="project-sort-order"
                    value="0"
                >


                <div class="modal-actions">
                    <button
                        type="submit"
                        class="primary-button"
                        id="save-button"
                    >
                        Save
                    </button>

                    <button
                        type="button"
                        onclick="closeModal()"
                    >
                        Cancel
                    </button>
                </div>

                <p id="form-message"></p>

            </form>
        </div>
    </div>


    <script>
        /* =================================
           SUPABASE
        ================================= */

        const SUPABASE_URL =
            "https://emuudatwzvzwfvxyoeed.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_Y7AJ0hXo7N5Ycrp5UevuIA_DFL2NcC8";

        let accessToken = null;
        let refreshToken = null;
        let sessionExpiresAt = 0;
        let refreshTimer = null;
        let currentTable = null;
        let currentProjectId = null;


        /* =================================
           HELPERS
        ================================= */

        function getHeaders() {
            return {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${accessToken}`,
                "Content-Type": "application/json"
            };
        }


        function saveSession(data) {
            accessToken = data.access_token;
            refreshToken = data.refresh_token || refreshToken;
            sessionExpiresAt = Date.now() + ((data.expires_in || 3600) * 1000);

            localStorage.setItem("portfolioSession", JSON.stringify({
                access_token: accessToken,
                refresh_token: refreshToken,
                expires_at: sessionExpiresAt
            }));

            scheduleRefresh();
        }


        function clearSession() {
            accessToken = null;
            refreshToken = null;
            sessionExpiresAt = 0;

            if (refreshTimer) {
                clearTimeout(refreshTimer);
                refreshTimer = null;
            }

            localStorage.removeItem("portfolioSession");
        }


        async function refreshSession() {
            if (!refreshToken) {
                return false;
            }

            try {
                const response = await fetch(
                    `${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,
                    {
                        method: "POST",
                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            refresh_token: refreshToken
                        })
                    }
                );

                if (!response.ok) {
                    clearSession();
                    return false;
                }

                const data = await response.json();
                saveSession(data);
                return true;
            } catch (error) {
                console.error("Session refresh failed:", error);
                clearSession();
                return false;
            }
        }


        function scheduleRefresh() {
            if (refreshTimer) {
                clearTimeout(refreshTimer);
            }

            const delay = Math.max(
                30000,
                sessionExpiresAt - Date.now() - 60000
            );

            refreshTimer = setTimeout(async () => {
                const refreshed = await refreshSession();

                if (!refreshed) {
                    showLogin();
                }
            }, delay);
        }


        function showDashboard() {
            document.getElementById("login-section").style.display = "none";
            document.getElementById("dashboard").style.display = "block";
        }


        function showLogin() {
            document.getElementById("dashboard").style.display = "none";
            document.getElementById("login-section").style.display = "block";
        }


        async function getErrorMessage(response) {
            let text = "";

            try {
                text = await response.text();
            } catch (error) {
                return `HTTP ${response.status}`;
            }

            if (!text) {
                return `HTTP ${response.status}`;
            }

            try {
                const data = JSON.parse(text);

                return (
                    data.message ||
                    data.error_description ||
                    data.msg ||
                    data.details ||
                    data.hint ||
                    text
                );
            } catch (error) {
                return text;
            }
        }


        function setFormMessage(message, type = "error") {
            const element =
                document.getElementById("form-message");

            element.textContent = message;
            element.className =
                type === "success"
                    ? "success-message"
                    : "error-message";
        }


        function clearFormMessage() {
            const element =
                document.getElementById("form-message");

            element.textContent = "";
            element.className = "";
        }


        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* =================================
           LOGIN
        ================================= */

        document
            .getElementById("login-form")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                message.textContent = "";
                message.className = "";

                try {
                    const response = await fetch(
                        `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
                        {
                            method: "POST",
                            headers: {
                                "apikey": SUPABASE_KEY,
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );

                    if (!response.ok) {
                        const error =
                            await getErrorMessage(response);

                        message.textContent =
                            error || "Login failed.";

                        message.className =
                            "error-message";

                        return;
                    }

                    const data =
                        await response.json();

                    saveSession(data);
                    showDashboard();

                    await loadAdminProjects();
                    await loadAdminPracticeProjects();

                } catch (error) {
                    console.error(error);

                    message.textContent =
                        error.message ||
                        "Login failed.";

                    message.className =
                        "error-message";
                }
            });


        /* =================================
           LOAD PROJECTS
        ================================= */

        async function loadAdminProjects() {
            await loadProjects(
                "projects",
                "projects-list"
            );
        }


        async function loadAdminPracticeProjects() {
            await loadProjects(
                "practice_projects",
                "practice-projects-list"
            );
        }


        async function loadProjects(table, containerId) {

            const container =
                document.getElementById(containerId);

            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/${table}?select=*&order=sort_order.asc`,
                    {
                        headers: getHeaders()
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        await getErrorMessage(response)
                    );
                }

                const projects =
                    await response.json();

                container.innerHTML = "";

                projects.forEach((project, index) => {

                    const item =
                        document.createElement("div");

                    item.className =
                        "project-item";

                    item.innerHTML = `
                        <div class="project-info">

                            <div class="project-title">
                                ${escapeHtml(project.title || "")}
                            </div>

                            <div class="project-meta">
                                Category:
                                ${escapeHtml(project.category || "—")}
                                <br>

                                Slug:
                                ${escapeHtml(project.slug || "—")}
                                <br>

                                Sort order:
                                ${project.sort_order ?? 0}
                                <br>

                                Featured:
                                ${project.featured ? "Yes" : "No"}
                            </div>

                        </div>

                        <div class="project-actions">

                            <button
                                type="button"
                                onclick="openEditModal('${table}', ${project.id})"
                            >
                                Edit
                            </button>

                            <div class="sort-buttons">

                                <button
                                    type="button"
                                    onclick="moveProject('${table}', ${project.id}, 'up')"
                                    ${index === 0 ? "disabled" : ""}
                                >
                                    ↑
                                </button>

                                <button
                                    type="button"
                                    onclick="moveProject('${table}', ${project.id}, 'down')"
                                    ${index === projects.length - 1 ? "disabled" : ""}
                                >
                                    ↓
                                </button>

                            </div>

                            <button
                                type="button"
                                class="danger-button"
                                onclick="deleteProject('${table}', ${project.id})"
                            >
                                Delete
                            </button>

                        </div>
                    `;

                    container.appendChild(item);
                });

            } catch (error) {
                console.error(
                    `Failed to load ${table}:`,
                    error
                );

                container.innerHTML =
                    `<p class="error-message">
                        Failed to load projects: ${escapeHtml(error.message)}
                    </p>`;
            }
        }


        /* =================================
           ADD
        ================================= */

        function openAddModal(table) {

            currentTable = table;
            currentProjectId = null;

            document
                .getElementById("project-form")
                .reset();

            clearFormMessage();

            document
                .getElementById("modal-title")
                .textContent =
                    table === "projects"
                        ? "Add Project"
                        : "Add Practice Project";

            document
                .getElementById("current-image")
                .style.display = "none";

            document
                .getElementById("project-image")
                .value = "";

            document
                .getElementById("current-case-image")
                .style.display = "none";

            document
                .getElementById("project-case-image")
                .value = "";

            document
                .getElementById("editor-modal")
                .style.display = "block";
        }


        /* =================================
           EDIT
        ================================= */

        async function openEditModal(table, id) {

            clearFormMessage();

            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}&select=*`,
                    {
                        headers: getHeaders()
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        await getErrorMessage(response)
                    );
                }

                const projects =
                    await response.json();

                if (!projects.length) {
                    throw new Error("Project not found.");
                }

                const project =
                    projects[0];

                currentTable = table;
                currentProjectId = id;

                document
                    .getElementById("modal-title")
                    .textContent =
                        table === "projects"
                            ? "Edit Project"
                            : "Edit Practice Project";

                document
                    .getElementById("project-title")
                    .value =
                        project.title || "";

                document
                    .getElementById("project-slug")
                    .value =
                        project.slug || "";

                document
                    .getElementById("project-category")
                    .value =
                        project.category || "";

                document
                    .getElementById("project-description")
                    .value =
                        project.description || "";

                document
                    .getElementById("project-case-subtitle")
                    .value =
                        project.case_subtitle || "";

                document
                    .getElementById("project-case-type")
                    .value =
                        project.case_type || "";

                document
                    .getElementById("project-case-focus")
                    .value =
                        project.case_focus || "";

                document
                    .getElementById("project-case-tools")
                    .value =
                        project.case_tools || "";

                document
                    .getElementById("project-case-project")
                    .value =
                        project.case_project || "";

                document
                    .getElementById("project-case-about")
                    .value =
                        project.case_about || "";

                document
                    .getElementById("project-case-direction")
                    .value =
                        project.case_direction || "";

                document
                    .getElementById("project-case-takeaway")
                    .value =
                        project.case_takeaway || "";

                document
                    .getElementById("project-url")
                    .value =
                        project.project_url || "";

                document
                    .getElementById("project-featured")
                    .checked =
                        Boolean(project.featured);

                document
                    .getElementById("project-sort-order")
                    .value =
                        project.sort_order ?? 0;

                const currentImage =
                    document.getElementById(
                        "current-image"
                    );

                const currentCaseImage =
                    document.getElementById(
                        "current-case-image"
                    );

                if (project.image_url) {
                    currentImage.src =
                        project.image_url;

                    currentImage.style.display =
                        "block";
                } else {
                    currentImage.removeAttribute("src");
                    currentImage.style.display =
                        "none";
                }

                document
                    .getElementById("project-image")
                    .value = "";

                if (project.case_image_url) {
                    currentCaseImage.src =
                        project.case_image_url;
                    currentCaseImage.style.display =
                        "block";
                } else {
                    currentCaseImage.removeAttribute("src");
                    currentCaseImage.style.display =
                        "none";
                }

                document
                    .getElementById("project-case-image")
                    .value = "";

                document
                    .getElementById("editor-modal")
                    .style.display = "block";

            } catch (error) {
                console.error(error);

                alert(
                    error.message ||
                    "Failed to load project."
                );
            }
        }


        /* =================================
           SAVE
        ================================= */

        document
            .getElementById("project-form")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                clearFormMessage();

                const saveButton =
                    document.getElementById("save-button");

                saveButton.disabled = true;
                saveButton.textContent = "Saving...";

                try {

                    const title =
                        document
                            .getElementById("project-title")
                            .value
                            .trim();

                    const slug =
                        document
                            .getElementById("project-slug")
                            .value
                            .trim();

                    if (!title || !slug) {
                        throw new Error(
                            "Title and Slug are required."
                        );
                    }

                    const category =
                        document
                            .getElementById("project-category")
                            .value
                            .trim();

                    const description =
                        document
                            .getElementById("project-description")
                            .value
                            .trim();

                    const projectUrl =
                        document
                            .getElementById("project-url")
                            .value
                            .trim();

                    const featured =
                        document
                            .getElementById("project-featured")
                            .checked;

                    const sortOrder =
                        Number(
                            document
                                .getElementById("project-sort-order")
                                .value || 0
                        );

                    if (!Number.isFinite(sortOrder)) {
                        throw new Error(
                            "Sort Order must be a valid number."
                        );
                    }


                    /* GET OLD PROJECT */

                    let oldProject = null;

                    if (currentProjectId !== null) {

                        const oldResponse =
                            await fetch(
                                `${SUPABASE_URL}/rest/v1/${currentTable}?id=eq.${currentProjectId}&select=*`,
                                {
                                    headers: getHeaders()
                                }
                            );

                        if (!oldResponse.ok) {
                            throw new Error(
                                await getErrorMessage(oldResponse)
                            );
                        }

                        const oldData =
                            await oldResponse.json();

                        if (!oldData.length) {
                            throw new Error(
                                "The project no longer exists."
                            );
                        }

                        oldProject =
                            oldData[0];
                    }


                    /* IMAGE */

                    let imageUrl =
                        oldProject?.image_url || null;

                    let oldImageUrl =
                        oldProject?.image_url || null;

                    let caseImageUrl =
                        oldProject?.case_image_url || null;

                    let oldCaseImageUrl =
                        oldProject?.case_image_url || null;

                    const imageFile =
                        document
                            .getElementById("project-image")
                            .files[0];

                    const caseImageFile =
                        document
                            .getElementById("project-case-image")
                            .files[0];


                    if (imageFile) {

                        const extension =
                            imageFile.name
                                .split(".")
                                .pop()
                                .toLowerCase();

                        const fileName =
                            `${Date.now()}-${Math.random()
                                .toString(36)
                                .substring(2)}.${extension}`;

                        const uploadResponse =
                            await fetch(
                                `${SUPABASE_URL}/storage/v1/object/portfolio-images/${fileName}`,
                                {
                                    method: "POST",
                                    headers: {
                                        "apikey": SUPABASE_KEY,
                                        "Authorization":
                                            `Bearer ${accessToken}`,
                                        "Content-Type":
                                            imageFile.type,
                                        "x-upsert": "false"
                                    },
                                    body: imageFile
                                }
                            );

                        if (!uploadResponse.ok) {
                            throw new Error(
                                `Image upload failed: ${await getErrorMessage(uploadResponse)}`
                            );
                        }

                        imageUrl =
                            `${SUPABASE_URL}/storage/v1/object/public/portfolio-images/${fileName}`;
                    }


                    if (caseImageFile) {

                        const extension =
                            caseImageFile.name
                                .split(".")
                                .pop()
                                .toLowerCase();

                        const fileName =
                            `${Date.now()}-${Math.random()
                                .toString(36)
                                .substring(2)}.${extension}`;

                        const uploadResponse =
                            await fetch(
                                `${SUPABASE_URL}/storage/v1/object/portfolio-images/${fileName}`,
                                {
                                    method: "POST",
                                    headers: {
                                        "apikey": SUPABASE_KEY,
                                        "Authorization":
                                            `Bearer ${accessToken}`,
                                        "Content-Type":
                                            caseImageFile.type,
                                        "x-upsert": "false"
                                    },
                                    body: caseImageFile
                                }
                            );

                        if (!uploadResponse.ok) {
                            throw new Error(
                                `Case study image upload failed: ${await getErrorMessage(uploadResponse)}`
                            );
                        }

                        caseImageUrl =
                            `${SUPABASE_URL}/storage/v1/object/public/portfolio-images/${fileName}`;
                    }


                    /* DATA */

                    const projectData = {
                        title: title,
                        slug: slug,
                        category: category,
                        description: description,
                        image_url: imageUrl,
                        project_url: projectUrl || null,
                        featured: featured,
                        sort_order: sortOrder,

                        case_subtitle:
                            document
                                .getElementById("project-case-subtitle")
                                .value
                                .trim() || null,

                        case_type:
                            document
                                .getElementById("project-case-type")
                                .value
                                .trim() || null,

                        case_focus:
                            document
                                .getElementById("project-case-focus")
                                .value
                                .trim() || null,

                        case_tools:
                            document
                                .getElementById("project-case-tools")
                                .value
                                .trim() || null,

                        case_project:
                            document
                                .getElementById("project-case-project")
                                .value
                                .trim() || null,

                        case_about:
                            document
                                .getElementById("project-case-about")
                                .value
                                .trim() || null,

                        case_direction:
                            document
                                .getElementById("project-case-direction")
                                .value
                                .trim() || null,

                        case_takeaway:
                            document
                                .getElementById("project-case-takeaway")
                                .value
                                .trim() || null,

                        case_image_url: caseImageUrl
                    };


                    /* INSERT */

                    if (currentProjectId === null) {

                        const response =
                            await fetch(
                                `${SUPABASE_URL}/rest/v1/${currentTable}`,
                                {
                                    method: "POST",
                                    headers: {
                                        ...getHeaders(),
                                        "Prefer":
                                            "return=representation"
                                    },
                                    body:
                                        JSON.stringify(projectData)
                                }
                            );

                        if (!response.ok) {
                            throw new Error(
                                `Failed to create project: ${await getErrorMessage(response)}`
                            );
                        }

                        if (currentTable === "practice_projects" && !projectUrl) {
                            const created = await response.json();
                            const createdId = created?.[0]?.id;

                            if (createdId) {
                                const urlResponse = await fetch(
                                    `${SUPABASE_URL}/rest/v1/practice_projects?id=eq.${createdId}`,
                                    {
                                        method: "PATCH",
                                        headers: {
                                            ...getHeaders(),
                                            "Prefer": "return=minimal"
                                        },
                                        body: JSON.stringify({
                                            project_url: `project.html?id=${createdId}&type=practice`
                                        })
                                    }
                                );

                                if (!urlResponse.ok) {
                                    throw new Error(
                                        `Failed to set practice project URL: ${await getErrorMessage(urlResponse)}`
                                    );
                                }
                            }
                        }

                    }


                    /* UPDATE */

                    else {

                        const response =
                            await fetch(
                                `${SUPABASE_URL}/rest/v1/${currentTable}?id=eq.${currentProjectId}`,
                                {
                                    method: "PATCH",
                                    headers: {
                                        ...getHeaders(),
                                        "Prefer":
                                            "return=representation"
                                    },
                                    body:
                                        JSON.stringify(projectData)
                                }
                            );

                        if (!response.ok) {
                            throw new Error(
                                `Failed to update project: ${await getErrorMessage(response)}`
                            );
                        }


                        /* DELETE OLD IMAGE ONLY AFTER SUCCESSFUL UPDATE */

                        if (
                            imageFile &&
                            oldImageUrl &&
                            imageUrl !== oldImageUrl
                        ) {
                            await deleteStorageImage(
                                oldImageUrl
                            );
                        }

                        if (
                            caseImageFile &&
                            oldCaseImageUrl &&
                            caseImageUrl !== oldCaseImageUrl
                        ) {
                            await deleteStorageImage(
                                oldCaseImageUrl
                            );
                        }
                    }


                    closeModal();

                    await loadAdminProjects();
                    await loadAdminPracticeProjects();

                } catch (error) {

                    console.error(
                        "SAVE ERROR:",
                        error
                    );

                    setFormMessage(
                        error.message ||
                        "Something went wrong."
                    );

                } finally {

                    saveButton.disabled = false;
                    saveButton.textContent = "Save";
                }
            });


        /* =================================
           DELETE PROJECT
        ================================= */

        async function deleteProject(table, id) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this project?"
                );

            if (!confirmed) {
                return;
            }

            try {

                const projectResponse =
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}&select=*`,
                        {
                            headers: getHeaders()
                        }
                    );

                if (!projectResponse.ok) {
                    throw new Error(
                        await getErrorMessage(projectResponse)
                    );
                }

                const projects =
                    await projectResponse.json();

                const project =
                    projects[0];


                const response =
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`,
                        {
                            method: "DELETE",
                            headers: getHeaders()
                        }
                    );

                if (!response.ok) {
                    throw new Error(
                        `Failed to delete project: ${await getErrorMessage(response)}`
                    );
                }


                if (
                    project &&
                    project.image_url
                ) {
                    await deleteStorageImage(
                        project.image_url
                    );
                }


                await loadAdminProjects();
                await loadAdminPracticeProjects();

            } catch (error) {

                console.error(error);

                alert(
                    error.message ||
                    "Failed to delete project."
                );
            }
        }


        /* =================================
           SORT
        ================================= */

        async function moveProject(table, id, direction) {

            try {

                const response =
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/${table}?select=*&order=sort_order.asc`,
                        {
                            headers: getHeaders()
                        }
                    );

                if (!response.ok) {
                    throw new Error(
                        await getErrorMessage(response)
                    );
                }

                const projects =
                    await response.json();

                const index =
                    projects.findIndex(
                        project =>
                            Number(project.id) === Number(id)
                    );

                if (index === -1) {
                    return;
                }

                const otherIndex =
                    direction === "up"
                        ? index - 1
                        : index + 1;

                if (
                    otherIndex < 0 ||
                    otherIndex >= projects.length
                ) {
                    return;
                }

                const current =
                    projects[index];

                const other =
                    projects[otherIndex];

                const currentOrder =
                    current.sort_order ?? 0;

                const otherOrder =
                    other.sort_order ?? 0;


                await updateSortOrder(
                    table,
                    current.id,
                    otherOrder
                );

                await updateSortOrder(
                    table,
                    other.id,
                    currentOrder
                );

                await loadAdminProjects();
                await loadAdminPracticeProjects();

            } catch (error) {

                console.error(error);

                alert(
                    error.message ||
                    "Failed to change sort order."
                );
            }
        }


        async function updateSortOrder(
            table,
            id,
            sortOrder
        ) {

            const response =
                await fetch(
                    `${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`,
                    {
                        method: "PATCH",
                        headers: {
                            ...getHeaders(),
                            "Prefer":
                                "return=minimal"
                        },
                        body:
                            JSON.stringify({
                                sort_order:
                                    sortOrder
                            })
                    }
                );

            if (!response.ok) {
                throw new Error(
                    `Failed to update sort order: ${await getErrorMessage(response)}`
                );
            }
        }


        /* =================================
           STORAGE DELETE
        ================================= */

        async function deleteStorageImage(imageUrl) {

            if (!imageUrl) {
                return;
            }

            const marker =
                "/storage/v1/object/public/portfolio-images/";

            const index =
                imageUrl.indexOf(marker);

            if (index === -1) {
                return;
            }

            const fileName =
                imageUrl.substring(
                    index + marker.length
                );

            if (!fileName) {
                return;
            }

            const response =
                await fetch(
                    `${SUPABASE_URL}/storage/v1/object/portfolio-images/${encodeURIComponent(fileName)}`,
                    {
                        method: "DELETE",
                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization":
                                `Bearer ${accessToken}`
                        }
                    }
                );

            if (!response.ok) {
                console.warn(
                    "Could not delete old image:",
                    await getErrorMessage(response)
                );
            }
        }


        /* =================================
           CLOSE MODAL
        ================================= */

        function closeModal() {

            document
                .getElementById("editor-modal")
                .style.display = "none";

            clearFormMessage();
        }


        /* =================================
           RESTORE SESSION
        ================================= */

        (async function restoreSession() {
            try {
                const stored =
                    JSON.parse(localStorage.getItem("portfolioSession") || "null");

                if (!stored || !stored.refresh_token) {
                    return;
                }

                accessToken = stored.access_token || null;
                refreshToken = stored.refresh_token;
                sessionExpiresAt = Number(stored.expires_at || 0);

                if (!accessToken || Date.now() >= sessionExpiresAt - 60000) {
                    const refreshed = await refreshSession();

                    if (!refreshed) {
                        showLogin();
                        return;
                    }
                } else {
                    scheduleRefresh();
                }

                showDashboard();
                await loadAdminProjects();
                await loadAdminPracticeProjects();

            } catch (error) {
                console.error("Session restore failed:", error);
                clearSession();
            }
        })();


        /* =================================
           LOGOUT
        ================================= */

        document
            .getElementById("logout-button")
            .addEventListener("click", function() {

                clearSession();
                currentTable = null;
                currentProjectId = null;

                document
                    .getElementById("dashboard")
                    .style.display = "none";

                document
                    .getElementById("login-section")
                    .style.display = "block";

                document
                    .getElementById("login-form")
                    .reset();

                document
                    .getElementById("message")
                    .textContent = "";
            });


        /* =================================
           MODAL BACKDROP / ESCAPE
        ================================= */

        document
            .getElementById("editor-modal")
            .addEventListener("click", function(event) {

                if (event.target === this) {
                    closeModal();
                }
            });


        document.addEventListener("keydown", function(event) {

            if (
                event.key === "Escape" &&
                document.getElementById("editor-modal").style.display === "block"
            ) {
                closeModal();
            }
        });

    </script>
