<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Project | Zsolti Sajter</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Average&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        .case-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 40px 100px;
        }

        .case-nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 40px;
        }

        .case-nav a {
            text-decoration: none;
        }

        .case-hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            padding: 80px 0;
        }

        .case-label {
            font-size: 13px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .case-hero h1 {
            font-family: "Average", serif;
            font-size: clamp(48px, 7vw, 90px);
            line-height: 0.95;
            margin: 0 0 25px;
        }

        .case-subtitle {
            font-size: 20px;
            line-height: 1.6;
            max-width: 600px;
        }

        .hero-mockup img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }

        .project-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            padding: 40px 0;
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
        }

        .project-summary span {
            display: block;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #777;
            margin-bottom: 10px;
        }

        .project-summary h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 500;
        }

        .case-section {
            padding: 90px 0;
            border-bottom: 1px solid #ddd;
        }

        .case-section h2 {
            font-family: "Average", serif;
            font-size: 48px;
            margin: 0 0 35px;
        }

        .case-content {
            max-width: 800px;
        }

        .case-content p {
            font-size: 18px;
            line-height: 1.8;
            margin: 0 0 25px;
        }

        .case-project {
            margin-top: 50px;
        }

        .case-project img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }

        .project-link-button {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 22px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .project-link-button:hover {
            background: #333;
        }

        .loading,
        .error {
            padding: 100px 0;
        }

        @media (max-width: 800px) {

            .case-page {
                padding: 20px 20px 70px;
            }

            .case-nav {
                padding: 20px;
            }

            .case-hero {
                grid-template-columns: 1fr;
                gap: 40px;
                padding: 50px 0;
            }

            .project-summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .case-section {
                padding: 60px 0;
            }

        }

        @media (max-width: 500px) {

            .project-summary {
                grid-template-columns: 1fr;
            }

            .case-hero h1 {
                font-size: 52px;
            }

        }

    </style>

</head>


<body>


<nav class="case-nav">

    <a href="index.html">
        ← Back to Portfolio
    </a>

</nav>


<main class="case-page">

    <div
        id="project-container"
        class="loading"
    >
        <p>Loading project...</p>
    </div>

</main>


<script>


const SUPABASE_URL =
    "https://emuudatwzvzwfvxyoeed.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Y7AJ0hXo7N5Ycrp5UevuIA_DFL2NcC8";



async function loadProject() {


    const container =
        document.getElementById(
            "project-container"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const projectId =
        params.get("id");


    if (!projectId) {

        container.innerHTML = `
            <div class="error">
                <p>Project not found.</p>
            </div>
        `;

        return;

    }


    try {


        const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/projects?id=eq.${encodeURIComponent(projectId)}&select=*`,
                {
                    method: "GET",

                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`
                    }
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "Supabase error:",
                errorText
            );

            container.innerHTML = `
                <div class="error">
                    <p>Failed to load project.</p>
                </div>
            `;

            return;

        }


        const projects =
            await response.json();


        if (!projects.length) {

            container.innerHTML = `
                <div class="error">
                    <p>Project not found.</p>
                </div>
            `;

            return;

        }


        const project =
            projects[0];


        document.title =
            `${project.title || "Project"} | Zsolti Sajter`;



        /* ==========================
           BASIC CONTENT
        ========================== */


        const category =
            project.category || "PROJECT";


        const title =
            project.title || "";


        const subtitle =
            project.case_subtitle ||
            project.description ||
            "";


        const description =
            project.description ||
            "";



        /* ==========================
           IMAGE
        ========================== */


        const heroImage =
            project.image_url
                ? `
                    <div class="hero-mockup">

                        <img
                            src="${escapeHtml(project.image_url)}"
                            alt="${escapeHtml(title)}"
                        >

                    </div>
                `
                : "";



        /* ==========================
           CASE STUDY SECTIONS
        ========================== */


        const about =
            project.case_about ||
            description ||
            "";


        const direction =
            project.case_direction ||
            "";


        const takeaway =
            project.case_takeaway ||
            "";


        const caseProject =
            project.case_project ||
            "";



        /* ==========================
           PROJECT URL
        ========================== */


        const projectUrl =
            project.project_url
                ? `
                    <a
                        href="${escapeHtml(project.project_url)}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="project-link-button"
                    >
                        View project →
                    </a>
                `
                : "";



        /* ==========================
           RENDER
        ========================== */


        container.innerHTML = `


            <section class="case-hero">


                <div class="hero-left">


                    <p class="case-label">
                        ${escapeHtml(category)}
                    </p>


                    <h1>
                        ${escapeHtml(title)}
                    </h1>


                    ${
                        subtitle
                            ? `
                                <p class="case-subtitle">
                                    ${escapeHtml(subtitle)}
                                </p>
                            `
                            : ""
                    }


                </div>


                ${heroImage}


            </section>



            <section class="project-summary">


                <div>

                    <span>Type</span>

                    <h3>
                        ${escapeHtml(
                            project.case_type || "—"
                        )}
                    </h3>

                </div>


                <div>

                    <span>Focus</span>

                    <h3>
                        ${escapeHtml(
                            project.case_focus || "—"
                        )}
                    </h3>

                </div>


                <div>

                    <span>Tools</span>

                    <h3>
                        ${escapeHtml(
                            project.case_tools || "—"
                        )}
                    </h3>

                </div>


                <div>

                    <span>Project</span>

                    <h3>
                        ${
                            project.featured
                                ? "Featured"
                                : "Portfolio Project"
                        }
                    </h3>

                </div>


            </section>



            ${
                about
                    ? `

                        <section class="case-section">


                            <h2>
                                About the project
                            </h2>


                            <div class="case-content">

                                ${formatText(about)}

                            </div>


                        </section>

                    `
                    : ""
            }



            ${
                caseProject
                    ? `

                        <section class="case-section">


                            <h2>
                                Project
                            </h2>


                            <div class="case-content">

                                ${formatText(caseProject)}

                            </div>


                        </section>

                    `
                    : ""
            }



            ${
                direction
                    ? `

                        <section class="case-section">


                            <h2>
                                Design direction
                            </h2>


                            <div class="case-content">

                                ${formatText(direction)}

                            </div>


                        </section>

                    `
                    : ""
            }



            ${
                takeaway
                    ? `

                        <section class="case-section">


                            <h2>
                                Takeaway
                            </h2>


                            <div class="case-content">

                                ${formatText(takeaway)}

                            </div>


                        </section>

                    `
                    : ""
            }



            ${
                projectUrl
                    ? `

                        <section class="case-section">

                            <div class="case-content">

                                ${projectUrl}

                            </div>

                        </section>

                    `
                    : ""
            }


        `;


    }

    catch (error) {

        console.error(
            "Failed to load project:",
            error
        );


        container.innerHTML = `
            <div class="error">
                <p>Failed to load project.</p>
            </div>
        `;

    }

}



/* ==========================
   TEXT FORMATTING
========================== */


function formatText(text) {

    return String(text)
        .split(/\n\s*\n/)
        .map(
            paragraph =>
                `<p>${escapeHtml(paragraph.trim())}</p>`
        )
        .join("");

}



/* ==========================
   HTML ESCAPE
========================== */


function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



loadProject();

</script>


</body>

</html>
