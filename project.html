<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Project | Zsolti Sajter</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Average&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

</head>


<body>


<nav class="case-nav">

    <a href="index.html">
        ← Back to Portfolio
    </a>

</nav>


<main id="project-container">

    <p>Loading project...</p>

</main>


<script>


const SUPABASE_URL =
    "https://emuudatwzvzwfvxyoeed.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_Y7AJ0hXo7N5Ycrp5UevuIA_DFL2NcC8";



/* ================================= */
/* HTML ESCAPE */
/* ================================= */

function escapeHtml(value) {

    return String(value || "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}



/* ================================= */
/* LOAD PROJECT */
/* ================================= */

async function loadProject() {


    const params =
        new URLSearchParams(
            window.location.search
        );


    const projectId =
        params.get("id");


    const container =
        document.getElementById(
            "project-container"
        );


    if (!projectId) {

        container.innerHTML =
            "<p>Project not found.</p>";

        return;

    }



    try {


        const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/projects?id=eq.${encodeURIComponent(projectId)}&select=*`,
                {
                    headers: {
                        "apikey": SUPABASE_KEY
                    }
                }
            );


        if (!response.ok) {

            console.error(
                "Failed to load project:",
                response.status
            );

            container.innerHTML =
                "<p>Failed to load project.</p>";

            return;

        }


        const projects =
            await response.json();


        if (!projects.length) {

            container.innerHTML =
                "<p>Project not found.</p>";

            return;

        }


        const project =
            projects[0];



        /* ================================= */
        /* HERO */
        /* ================================= */


        const heroImage =
            project.image_url
                ? `
                    <img
                        src="${escapeHtml(project.image_url)}"
                        alt="${escapeHtml(project.title)}"
                    >
                `
                : "";



        /* ================================= */
        /* SUMMARY VALUES */
        /* ================================= */


        const projectType =
            project.case_type || "—";


        const projectFocus =
            project.case_focus || "—";


        const projectTools =
            project.case_tools || "—";


        const projectStatus =
            project.featured
                ? "Featured"
                : "Portfolio Project";



        /* ================================= */
        /* CASE STUDY CONTENT */
        /* ================================= */


        const aboutProject =
            project.case_about ||
            project.description ||
            "";


        const designDirection =
            project.case_direction ||
            "";


        const takeaway =
            project.case_takeaway ||
            "";



        /* ================================= */
        /* BUILD PAGE */
        /* ================================= */


        container.innerHTML = `

            <!-- HERO -->

            <section class="case-hero">


                <div class="hero-left">


                    <p class="case-label">
                        ${escapeHtml(
                            project.category || "PROJECT"
                        )}
                    </p>


                    <h1>
                        ${escapeHtml(
                            project.title || ""
                        )}
                    </h1>


                    <p class="case-subtitle">
                        ${escapeHtml(
                            project.case_subtitle ||
                            project.description ||
                            ""
                        )}
                    </p>


                </div>



                <div class="hero-mockup">

                    ${heroImage}

                </div>


            </section>



            <!-- PROJECT SUMMARY -->

            <section class="project-summary">


                <div>

                    <span>
                        Type
                    </span>

                    <h3>
                        ${escapeHtml(
                            projectType
                        )}
                    </h3>

                </div>



                <div>

                    <span>
                        Focus
                    </span>

                    <h3>
                        ${escapeHtml(
                            projectFocus
                        )}
                    </h3>

                </div>



                <div>

                    <span>
                        Tools
                    </span>

                    <h3>
                        ${escapeHtml(
                            projectTools
                        )}
                    </h3>

                </div>



                <div>

                    <span>
                        Project
                    </span>

                    <h3>
                        ${escapeHtml(
                            projectStatus
                        )}
                    </h3>

                </div>


            </section>



            <div class="section-divider"></div>



            <!-- ABOUT THE PROJECT -->

            ${
                aboutProject
                ? `

                    <section class="case-section">


                        <h2>
                            About the project
                        </h2>


                        <div class="case-content">

                            <p>
                                ${escapeHtml(
                                    aboutProject
                                )}
                            </p>

                        </div>


                    </section>

                `
                : ""
            }



            <!-- DESIGN DIRECTION -->

            ${
                designDirection
                ? `

                    <section class="case-section">


                        <h2>
                            Design direction
                        </h2>


                        <div class="case-content">

                            <p>
                                ${escapeHtml(
                                    designDirection
                                )}
                            </p>

                        </div>


                    </section>

                `
                : ""
            }



            <!-- TAKEAWAY -->

            ${
                takeaway
                ? `

                    <section class="case-section">


                        <h2>
                            Takeaway
                        </h2>


                        <div class="case-content">

                            <p>
                                ${escapeHtml(
                                    takeaway
                                )}
                            </p>

                        </div>


                    </section>

                `
                : ""
            }



            <!-- PROJECT LINK -->

            ${
                project.project_url
                ? `

                    <section class="case-section">


                        <h2>
                            Project
                        </h2>


                        <div class="case-content">

                            <p>

                                <a
                                    href="${escapeHtml(project.project_url)}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    View project →
                                </a>

                            </p>

                        </div>


                    </section>

                `
                : ""
            }

        `;


    }

    catch (error) {

        console.error(
            "Error loading project:",
            error
        );


        container.innerHTML =
            "<p>Something went wrong while loading the project.</p>";

    }

}



/* ================================= */
/* START */
/* ================================= */

loadProject();


</script>


</body>

</html>
