<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin — Portfolio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 100px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Portfolio Admin</h1>

    <form id="login-form">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Log in
        </button>

    </form>

    <p id="message"></p>


    <script>

        const SUPABASE_URL =
            "https://emuudatwzvzwfvxyoeed.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_Y7AJ0hXo7N5Ycrp5UevuIA_DFL2NcC8";


        document
            .getElementById("login-form")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");


                const response = await fetch(
                    `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
                    {
                        method: "POST",

                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                if (!response.ok) {

    const error = await response.json();

    console.error("Supabase login error:", error);

    message.textContent =
        error.message || "Login failed.";

    return;
}


                const data =
                    await response.json();

                console.log("Logged in:", data);

                message.textContent =
                    "Login successful!";

            });

    </script>

</body>
</html>
