<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin — Portfolio</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            max-width: 1000px;

            margin: 60px auto;

            padding: 20px;

            background: #f7f7f7;
        }


        h1 {
            margin-bottom: 30px;
        }


        h2 {
            margin-top: 40px;
        }


        button {

            padding: 10px 16px;

            cursor: pointer;

            border: 1px solid #ccc;

            background: white;

            border-radius: 5px;
        }


        button:hover {
            background: #eee;
        }


        .primary-button {

            background: #111;

            color: white;

            border-color: #111;
        }


        .primary-button:hover {
            background: #333;
        }


        .danger-button {

            background: #b00020;

            color: white;

            border-color: #b00020;
        }


        .danger-button:hover {
            background: #8d001a;
        }


        /* LOGIN */

        #login-section {

            max-width: 500px;

            margin: 100px auto;
        }


        input,
        textarea,
        select {

            width: 100%;

            padding: 12px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-family: inherit;

            font-size: 16px;
        }


        textarea {

            min-height: 120px;

            resize: vertical;
        }


        /* DASHBOARD */

        .section-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-top: 40px;

            margin-bottom: 20px;
        }


        .section-header h2 {
            margin: 0;
        }


        .project-item {

            background: white;

            border: 1px solid #ddd;

            border-radius: 8px;

            padding: 18px;

            margin-bottom: 12px;
        }


        .project-info {

            margin-bottom: 15px;
        }


        .project-title {

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 6px;
        }


        .project-meta {

            color: #666;

            font-size: 14px;
        }


        .project-actions {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;
        }


        .sort-buttons {

            display: flex;

            gap: 5px;
        }


        #logout-button {

            margin-top: 40px;
        }


        #message {

            margin-top: 20px;
        }


        /* MODAL */

        #editor-modal {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.5);

            padding: 30px;

            overflow-y: auto;

            z-index: 1000;
        }


        .modal-content {

            background: white;

            max-width: 700px;

            margin: 40px auto;

            padding: 30px;

            border-radius: 10px;
        }


        .modal-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .modal-header h2 {
            margin: 0;
        }


        .close-button {

            font-size: 22px;

            border: none;

            background: none;
        }


        .form-label {

            display: block;

            font-weight: bold;

            margin-bottom: 6px;
        }


        .checkbox-row {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 20px;
        }


        .checkbox-row input {

            width: auto;

            margin: 0;
        }


        .modal-actions {

            display: flex;

            gap: 10px;

            margin-top: 20px;
        }


        #current-image {

            max-width: 200px;

            max-height: 150px;

            display: none;

            object-fit: cover;

            margin-bottom: 15px;

            border-radius: 5px;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            body {

                margin: 20px auto;

                padding: 15px;
            }


            #login-section {

                margin: 50px auto;
            }


            h1 {
                font-size: 28px;
            }


            .section-header {

                align-items: stretch;

                flex-direction: column;
            }


            .section-header button {
                width: 100%;
            }


            .project-actions button {

                flex: 1 1 calc(50% - 8px);
            }


            #editor-modal {

                padding: 10px;
            }


            .modal-content {

                margin: 10px auto;

                padding: 20px;
            }


            .modal-actions {

                flex-direction: column;
            }


            .modal-actions button {

                width: 100%;
            }
        }

    </style>

</head>


<body>


    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->

    <div id="login-section">

        <h1>Portfolio Admin</h1>


        <form id="login-form">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >


            <button
                type="submit"
                class="primary-button"
            >
                Log in
            </button>

        </form>


        <p id="message"></p>

    </div>



    <!-- ========================= -->
    <!-- DASHBOARD -->
    <!-- ========================= -->

    <div
        id="dashboard"
        style="display: none;"
    >

        <h1>Admin Dashboard</h1>


        <!-- PROJECTS -->

        <section>

            <div class="section-header">

                <h2>Projects</h2>

                <button
                    class="primary-button"
                    onclick="openAddModal('projects')"
                >
                    + Add Project
                </button>

            </div>


            <div id="projects-list"></div>

        </section>



        <!-- PRACTICE PROJECTS -->

        <section>

            <div class="section-header">

                <h2>Practice Projects</h2>

                <button
                    class="primary-button"
                    onclick="openAddModal('practice_projects')"
                >
                    + Add Practice Project
                </button>

            </div>


            <div id="practice-projects-list"></div>

        </section>


        <button id="logout-button">
            Log out
        </button>

    </div>



    <!-- ========================= -->
    <!-- EDITOR MODAL -->
    <!-- ========================= -->

    <div id="editor-modal">

        <div class="modal-content">


            <div class="modal-header">

                <h2 id="modal-title">
                    Add Project
                </h2>


                <button
                    class="close-button"
                    onclick="closeModal()"
                >
                    ×
                </button>

            </div>



            <form id="project-form">


                <label class="form-label">
                    Title
                </label>

                <input
                    type="text"
                    id="project-title"
                    required
                >



                <label class="form-label">
                    Slug
                </label>

                <input
                    type="text"
                    id="project-slug"
                    required
                >



                <label class="form-label">
                    Category
                </label>

                <input
                    type="text"
                    id="project-category"
                >



                <label class="form-label">
                    Description
                </label>

                <textarea
                    id="project-description"
                ></textarea>
                <label class="form-label">
    Case Study Subtitle
</label>

<textarea
    id="project-case-subtitle"
    placeholder="Short introduction displayed in the hero section"
></textarea>


<label class="form-label">
    Type
</label>

<input
    type="text"
    id="project-case-type"
    placeholder="e.g. Brand Identity"
>


<label class="form-label">
    Focus
</label>

<input
    type="text"
    id="project-case-focus"
    placeholder="e.g. Packaging"
>


<label class="form-label">
    Tools
</label>

<input
    type="text"
    id="project-case-tools"
    placeholder="e.g. Figma"
>


<label class="form-label">
    Project
</label>

<input
    type="text"
    id="project-case-project"
    placeholder="e.g. Self-initiated"
>


<label class="form-label">
    About the Project
</label>

<textarea
    id="project-case-about"
    placeholder="Describe the project..."
></textarea>


<label class="form-label">
    Design Direction
</label>

<textarea
    id="project-case-direction"
    placeholder="Describe the design direction..."
></textarea>


<label class="form-label">
    Takeaway
</label>

<textarea
    id="project-case-takeaway"
    placeholder="What did you learn from this project?"
></textarea>



                <label class="form-label">
                    Project URL
                </label>

                <input
                    type="text"
                    id="project-url"
                    placeholder="https://..."
                >



                <label class="form-label">
                    Current Image
                </label>

                <img
                    id="current-image"
                    alt="Current project image"
                >



                <label class="form-label">
                    Upload Image
                </label>

                <input
                    type="file"
                    id="project-image"
                    accept="image/*"
                >



                <div class="checkbox-row">

                    <input
                        type="checkbox"
                        id="project-featured"
                    >

                    <label for="project-featured">
                        Featured
                    </label>

                </div>



                <label class="form-label">
                    Sort Order
                </label>

                <input
                    type="number"
                    id="project-sort-order"
                    value="0"
                >



                <div class="modal-actions">

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Save
                    </button>


                    <button
                        type="button"
                        onclick="closeModal()"
                    >
                        Cancel
                    </button>

                </div>


            </form>

        </div>

    </div>



    <script>


        /* ================================= */
        /* SUPABASE */
        /* ================================= */


        const SUPABASE_URL =
            "https://emuudatwzvzwfvxyoeed.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_Y7AJ0hXo7N5Ycrp5UevuIA_DFL2NcC8";


        let accessToken = null;


        let currentTable = null;

        let currentProjectId = null;



        /* ================================= */
        /* LOGIN */
        /* ================================= */


        document
            .getElementById("login-form")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const email =
                        document.getElementById("email").value;


                    const password =
                        document.getElementById("password").value;


                    const message =
                        document.getElementById("message");


                    const response =
                        await fetch(
                            `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
                            {

                                method: "POST",

                                headers: {

                                    "apikey":
                                        SUPABASE_KEY,

                                    "Content-Type":
                                        "application/json"

                                },

                                body: JSON.stringify({

                                    email:
                                        email,

                                    password:
                                        password

                                })

                            }
                        );


                    if (!response.ok) {

                        const errorData =
                            await response.json();


                        console.error(
                            "Supabase login error:",
                            errorData
                        );


                        message.textContent =
                            errorData.error_description ||
                            errorData.msg ||
                            errorData.message ||
                            "Login failed.";


                        return;

                    }


                    const data =
                        await response.json();


                    accessToken =
                        data.access_token;


                    document
                        .getElementById("login-section")
                        .style.display = "none";


                    document
                        .getElementById("dashboard")
                        .style.display = "block";


                    await loadAdminProjects();

                    await loadAdminPracticeProjects();

                }
            );



        /* ================================= */
        /* COMMON HEADERS */
        /* ================================= */


        function getHeaders() {

            return {

                "apikey":
                    SUPABASE_KEY,

                "Authorization":
                    `Bearer ${accessToken}`,

                "Content-Type":
                    "application/json"

            };

        }



        /* ================================= */
        /* LOAD PROJECTS */
        /* ================================= */


        async function loadAdminProjects() {

            await loadProjects(
                "projects",
                "projects-list"
            );

        }



        async function loadAdminPracticeProjects() {

            await loadProjects(
                "practice_projects",
                "practice-projects-list"
            );

        }



        async function loadProjects(
            table,
            containerId
        ) {


            const response =
                await fetch(
                    `${SUPABASE_URL}/rest/v1/${table}?select=*&order=sort_order.asc`,
                    {
                        headers: getHeaders()
                    }
                );


            if (!response.ok) {

                console.error(
                    `Failed to load ${table}:`,
                    response.status
                );

                return;

            }


            const projects =
                await response.json();


            const container =
                document.getElementById(
                    containerId
                );


            container.innerHTML = "";


            projects.forEach(
                (project, index) => {


                    const item =
                        document.createElement("div");


                    item.className =
                        "project-item";


                    item.innerHTML = `

                        <div class="project-info">

                            <div class="project-title">
                                ${escapeHtml(project.title || "")}
                            </div>

                            <div class="project-meta">

                                Category:
                                ${escapeHtml(project.category || "—")}

                                <br>

                                Slug:
                                ${escapeHtml(project.slug || "—")}

                                <br>

                                Sort order:
                                ${project.sort_order ?? 0}

                                <br>

                                Featured:
                                ${project.featured ? "Yes" : "No"}

                            </div>

                        </div>


                        <div class="project-actions">

                            <button
                                onclick="openEditModal('${table}', ${project.id})"
                            >
                                Edit
                            </button>


                            <div class="sort-buttons">

                                <button
                                    onclick="moveProject('${table}', ${project.id}, 'up')"
                                    ${index === 0 ? "disabled" : ""}
                                >
                                    ↑
                                </button>


                                <button
                                    onclick="moveProject('${table}', ${project.id}, 'down')"
                                    ${index === projects.length - 1 ? "disabled" : ""}
                                >
                                    ↓
                                </button>

                            </div>


                            <button
                                class="danger-button"
                                onclick="deleteProject('${table}', ${project.id})"
                            >
                                Delete
                            </button>

                        </div>

                    `;


                    container.appendChild(item);

                }
            );

        }



        /* ================================= */
        /* ADD */
        /* ================================= */


        function openAddModal(table) {

            currentTable = table;

            currentProjectId = null;


            document
                .getElementById("project-form")
                .reset();


            document
                .getElementById("modal-title")
                .textContent =
                    table === "projects"
                        ? "Add Project"
                        : "Add Practice Project";


            document
                .getElementById("current-image")
                .style.display = "none";


            document
                .getElementById("editor-modal")
                .style.display = "block";

        }



        /* ================================= */
        /* EDIT */
        /* ================================= */


        async function openEditModal(
            table,
            id
        ) {


            const response =
                await fetch(
                    `${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}&select=*`,
                    {
                        headers: getHeaders()
                    }
                );


            if (!response.ok) {

                alert("Failed to load project.");

                return;

            }


            const projects =
                await response.json();


            if (!projects.length) {

                alert("Project not found.");

                return;

            }


            const project =
                projects[0];


            currentTable =
                table;


            currentProjectId =
                id;


            document
                .getElementById("modal-title")
                .textContent =
                    table === "projects"
                        ? "Edit Project"
                        : "Edit Practice Project";


            document
                .getElementById("project-title")
                .value =
                    project.title || "";


            document
                .getElementById("project-slug")
                .value =
                    project.slug || "";


            document
                .getElementById("project-category")
                .value =
                    project.category || "";


            document
                .getElementById("project-description")
                .value =
                    project.description || "";
            document
    .getElementById("project-case-subtitle")
    .value =
        project.case_subtitle || "";

document
    .getElementById("project-case-type")
    .value =
        project.case_type || "";

document
    .getElementById("project-case-focus")
    .value =
        project.case_focus || "";

document
    .getElementById("project-case-tools")
    .value =
        project.case_tools || "";


document
    .getElementById("project-case-about")
    .value =
        project.case_about || "";

document
    .getElementById("project-case-direction")
    .value =
        project.case_direction || "";

document
    .getElementById("project-case-takeaway")
    .value =
        project.case_takeaway || "";


            document
                .getElementById("project-url")
                .value =
                    project.project_url || "";


            document
                .getElementById("project-featured")
                .checked =
                    project.featured || false;


            document
                .getElementById("project-sort-order")
                .value =
                    project.sort_order ?? 0;


            const currentImage =
                document.getElementById(
                    "current-image"
                );


            if (project.image_url) {

                currentImage.src =
                    project.image_url;

                currentImage.style.display =
                    "block";

            } else {

                currentImage.style.display =
                    "none";

            }


            document
                .getElementById("project-image")
                .value = "";


            document
                .getElementById("editor-modal")
                .style.display =
                    "block";

        }



        /* ================================= */
        /* SAVE */
        /* ================================= */


        document
            .getElementById("project-form")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const title =
                        document
                            .getElementById(
                                "project-title"
                            )
                            .value
                            .trim();


                    const slug =
                        document
                            .getElementById(
                                "project-slug"
                            )
                            .value
                            .trim();


                    const category =
                        document
                            .getElementById(
                                "project-category"
                            )
                            .value
                            .trim();


                    const description =
                        document
                            .getElementById(
                                "project-description"
                            )
                            .value
                            .trim();


                    const projectUrl =
                        document
                            .getElementById(
                                "project-url"
                            )
                            .value
                            .trim();


                    const featured =
                        document
                            .getElementById(
                                "project-featured"
                            )
                            .checked;


                    const sortOrder =
                        Number(
                            document
                                .getElementById(
                                    "project-sort-order"
                                )
                                .value
                        );


                    const imageFile =
                        document
                            .getElementById(
                                "project-image"
                            )
                            .files[0];


                    const saveButton =
                        event.target.querySelector(
                            'button[type="submit"]'
                        );


                    saveButton.disabled =
                        true;


                    saveButton.textContent =
                        "Saving...";


                    try {


                        let imageUrl =
                            null;


                        let oldImageUrl =
                            null;



                        /* GET OLD PROJECT */

                        if (currentProjectId) {

                            const oldResponse =
                                await fetch(
                                    `${SUPABASE_URL}/rest/v1/${currentTable}?id=eq.${currentProjectId}&select=*`,
                                    {
                                        headers:
                                            getHeaders()
                                    }
                                );


                            const oldData =
                                await oldResponse.json();


                            if (oldData.length) {

                                imageUrl =
                                    oldData[0].image_url;

                                oldImageUrl =
                                    oldData[0].image_url;

                            }

                        }



                        /* UPLOAD IMAGE */

                        if (imageFile) {

                            const fileExtension =
                                imageFile.name
                                    .split(".")
                                    .pop();


                            const fileName =
                                `${Date.now()}-${Math.random().toString(36).substring(2)}.${fileExtension}`;


                            const uploadResponse =
                                await fetch(
                                    `${SUPABASE_URL}/storage/v1/object/portfolio-images/${fileName}`,
                                    {

                                        method: "POST",

                                        headers: {

                                            "apikey":
                                                SUPABASE_KEY,

                                            "Authorization":
                                                `Bearer ${accessToken}`,

                                            "Content-Type":
                                                imageFile.type,

                                            "x-upsert":
                                                "false"

                                        },

                                        body:
                                            imageFile

                                    }
                                );


                            if (!uploadResponse.ok) {

                                const uploadError =
                                    await uploadResponse.text();

                                console.error(
                                    uploadError
                                );

                                throw new Error(
                                    "Image upload failed."
                                );

                            }


                            imageUrl =
                                `${SUPABASE_URL}/storage/v1/object/public/portfolio-images/${fileName}`;

                        }



                        /* DATA */

                        const projectData = {

    title:
        title,

    slug:
        slug,

    category:
        category,

    description:
        description,

    image_url:
        imageUrl,

    project_url:
        projectUrl || null,

    featured:
        featured,

    sort_order:
        sortOrder,

    case_subtitle:
        document
            .getElementById("project-case-subtitle")
            .value
            .trim() || null,

    case_type:
        document
            .getElementById("project-case-type")
            .value
            .trim() || null,

    case_focus:
        document
            .getElementById("project-case-focus")
            .value
            .trim() || null,

    case_tools:
        document
            .getElementById("project-case-tools")
            .value
            .trim() || null,

    case_project:
        document
            .getElementById("project-case-project")
            .value
            .trim() || null,

    case_about:
        document
            .getElementById("project-case-about")
            .value
            .trim() || null,

    case_direction:
        document
            .getElementById("project-case-direction")
            .value
            .trim() || null,

    case_takeaway:
        document
            .getElementById("project-case-takeaway")
            .value
            .trim() || null

};


                        /* INSERT */

                        if (!currentProjectId) {


                            const response =
                                await fetch(
                                    `${SUPABASE_URL}/rest/v1/${currentTable}`,
                                    {

                                        method: "POST",

                                        headers: {

                                            ...getHeaders(),

                                            "Prefer":
                                                "return=representation"

                                        },

                                        body:
                                            JSON.stringify(
                                                projectData
                                            )

                                    }
                                );


                            if (!response.ok) {

                                const error =
                                    await response.text();

                                console.error(
                                    error
                                );

                                throw new Error(
                                    "Failed to create project."
                                );

                            }

                        }



                        /* UPDATE */

                        else {


                            const response =
                                await fetch(
                                    `${SUPABASE_URL}/rest/v1/${currentTable}?id=eq.${currentProjectId}`,
                                    {

                                        method: "PATCH",

                                        headers: {

                                            ...getHeaders(),

                                            "Prefer":
                                                "return=representation"

                                        },

                                        body:
                                            JSON.stringify(
                                                projectData
                                            )

                                    }
                                );


                            if (!response.ok) {

                                const error =
                                    await response.text();

                                console.error(
                                    error
                                );

                                throw new Error(
                                    "Failed to update project."
                                );

                            }



                            /* DELETE OLD IMAGE */

                            if (
                                imageFile &&
                                oldImageUrl
                            ) {

                                await deleteStorageImage(
                                    oldImageUrl
                                );

                            }

                        }



                        closeModal();


                        await loadAdminProjects();

                        await loadAdminPracticeProjects();


                    }

                    catch (error) {

                        console.error(error);

                        alert(
                            error.message ||
                            "Something went wrong."
                        );

                    }


                    finally {

                        saveButton.disabled =
                            false;

                        saveButton.textContent =
                            "Save";

                    }

                }
            );



        /* ================================= */
        /* DELETE PROJECT */
        /* ================================= */


        async function deleteProject(
            table,
            id
        ) {


            const confirmed =
                confirm(
                    "Are you sure you want to delete this project?"
                );


            if (!confirmed) {
                return;
            }


            /* GET PROJECT */

            const projectResponse =
                await fetch(
                    `${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}&select=*`,
                    {
                        headers:
                            getHeaders()
                    }
                );


            const projects =
                await projectResponse.json();


            const project =
                projects[0];


            /* DELETE DATABASE ROW */

            const response =
                await fetch(
                    `${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`,
                    {

                        method: "DELETE",

                        headers:
                            getHeaders()

                    }
                );


            if (!response.ok) {

                alert(
                    "Failed to delete project."
                );

                return;

            }


            /* DELETE IMAGE */

            if (
                project &&
                project.image_url
            ) {

                await deleteStorageImage(
                    project.image_url
                );

            }


            await loadAdminProjects();

            await loadAdminPracticeProjects();

        }



        /* ================================= */
        /* SORT */
        /* ================================= */


        async function moveProject(
            table,
            id,
            direction
        ) {


            const response =
                await fetch(
                    `${SUPABASE_URL}/rest/v1/${table}?select=*&order=sort_order.asc`,
                    {
                        headers:
                            getHeaders()
                    }
                );


            const projects =
                await response.json();


            const index =
                projects.findIndex(
                    project =>
                        project.id === id
                );


            if (index === -1) {
                return;
            }


            const otherIndex =
                direction === "up"
                    ? index - 1
                    : index + 1;


            if (
                otherIndex < 0 ||
                otherIndex >= projects.length
            ) {
                return;
            }


            const current =
                projects[index];


            const other =
                projects[otherIndex];


            const currentOrder =
                current.sort_order ?? 0;


            const otherOrder =
                other.sort_order ?? 0;


            /* SWAP */

            await updateSortOrder(
                table,
                current.id,
                otherOrder
            );


            await updateSortOrder(
                table,
                other.id,
                currentOrder
            );


            await loadAdminProjects();

            await loadAdminPracticeProjects();

        }



        async function updateSortOrder(
            table,
            id,
            sortOrder
        ) {


            await fetch(
                `${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`,
                {

                    method: "PATCH",

                    headers: {

                        ...getHeaders(),

                        "Prefer":
                            "return=minimal"

                    },

                    body:
                        JSON.stringify({
                            sort_order:
                                sortOrder
                        })

                }
            );

        }



        /* ================================= */
        /* STORAGE DELETE */
        /* ================================= */


        async function deleteStorageImage(
            imageUrl
        ) {


            const marker =
                "/storage/v1/object/public/portfolio-images/";


            const index =
                imageUrl.indexOf(marker);


            if (index === -1) {
                return;
            }


            const fileName =
                imageUrl.substring(
                    index + marker.length
                );


            await fetch(
                `${SUPABASE_URL}/storage/v1/object/portfolio-images/${encodeURIComponent(fileName)}`,
                {

                    method: "DELETE",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${accessToken}`

                    }

                }
            );

        }



        /* ================================= */
        /* CLOSE MODAL */
        /* ================================= */


        function closeModal() {

            document
                .getElementById("editor-modal")
                .style.display =
                    "none";

        }



        /* ================================= */
        /* HTML ESCAPE */
        /* ================================= */


        function escapeHtml(value) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        /* ================================= */
        /* LOGOUT */
        /* ================================= */


        document
            .getElementById("logout-button")
            .addEventListener(
                "click",
                function() {


                    accessToken =
                        null;


                    document
                        .getElementById(
                            "dashboard"
                        )
                        .style.display =
                            "none";


                    document
                        .getElementById(
                            "login-section"
                        )
                        .style.display =
                            "block";


                    document
                        .getElementById(
                            "login-form"
                        )
                        .reset();


                }
            );


    </script>
